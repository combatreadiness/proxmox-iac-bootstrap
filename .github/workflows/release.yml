name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build archive and checksums
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="proxmox-iac-bootstrap-${tag}"
          mkdir -p dist "stage/${name}"
          cp -r install.sh bootstrap README.md LICENSE "stage/${name}/"
          echo "${tag}" > "stage/${name}/VERSION"
          chmod 755 "stage/${name}/install.sh" "stage/${name}/bootstrap/dsoadm" "stage/${name}"/bootstrap/*.sh
          # Same commit -> same bytes: fixed order, owner and timestamps
          ts="$(git log -1 --format=%ct)"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${ts}" \
            -C stage -cf - "${name}" | gzip -n > "dist/${name}.tar.gz"
          cp install.sh dist/install.sh
          (cd dist && sha256sum -- *.tar.gz install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist when the tag was made from the GitHub web UI
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
